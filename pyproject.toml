[project]
name = "langgraph-research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.5",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.24",
    "langgraph-cli[inemem,inmem]>=0.4.43",
]

[project.scripts]
langgraph-research-agent = "langgraph_research_agent:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
